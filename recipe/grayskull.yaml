{% set name = "pandas-stubs" %}
{% set version = "2.2.3.250308" %}
package:
  name: {{ name|lower }}
  version: {{ version }}
source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/pandas_stubs-{{ version }}.tar.gz
  sha256: 3a6e9daf161f00b85c83772ed3d5cff9522028f07a94817472c07b91f46710fd
build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
requirements:
  host:
    - python >=3.10
    - poetry-core >=1.0.0
    - pip
  run:
    - python >=3.10
    - types-pytz >=2022.1.1
    - numpy >=1.23.5
test:
  imports:
    - pandas_stubs
  commands:
    - pip check
  requires:
    - pip
about:
  home: https://pandas.pydata.org
  summary: Type annotations for pandas
  license: BSD-3-Clause
  license_file: LICENSE
extra:
  recipe-maintainers:
    - AddYourGitHubIdHere
